name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Fetch FFmpeg
        shell: pwsh
        run: ./packaging/fetch_ffmpeg.ps1

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "1.0.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build app (PyInstaller)
        run: pyinstaller packaging/lorekeeper.spec --noconfirm --clean

      - name: Self-test the frozen build
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Lorekeeper\Lorekeeper.exe" -ArgumentList "--selftest", "$env:RUNNER_TEMP\selftest.json" -PassThru -Wait
          Get-Content "$env:RUNNER_TEMP\selftest.json"
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit $($p.ExitCode))" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: Lorekeeper-Setup-${{ steps.ver.outputs.version }}
          path: dist/Lorekeeper-Setup-*.exe

      - name: Publish release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Lorekeeper-Setup-*.exe
